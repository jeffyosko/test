<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Snake Game</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1f2937, #111827 60%);
      color: #e5e7eb;
    }
    .game-shell {
      width: min(92vw, 520px);
      display: grid;
      gap: 12px;
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.95rem;
    }
    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    .controls { font-size: 0.9rem; color: #cbd5e1; }
    button {
      background: #22c55e;
      border: none;
      color: #052e16;
      font-weight: 700;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>Snake</h1>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <button id="restart" type="button">Restart</button>
    </div>
    <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
    <p class="controls">Use arrow keys (or WASD) to move. Eat red food, avoid walls and yourself.</p>
  </main>

  <script>
    const board = document.getElementById('board');
    const ctx = board.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restart');

    const gridSize = 20;
    const tileCount = board.width / gridSize;
    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let gameOver;
    let tickInterval;

    function randomTile() {
      return Math.floor(Math.random() * tileCount);
    }

    function placeFood() {
      do {
        food = { x: randomTile(), y: randomTile() };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreEl.textContent = score;
      placeFood();
      draw();
    }

    function drawGrid() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, board.width, board.height);

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      for (let i = 0; i <= tileCount; i++) {
        const pos = i * gridSize;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, board.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(board.width, pos);
        ctx.stroke();
      }
    }

    function draw() {
      drawGrid();

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);

      snake.forEach((segment, idx) => {
        ctx.fillStyle = idx === 0 ? '#22c55e' : '#4ade80';
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, board.width, board.height);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', board.width / 2, board.height / 2 - 8);
        ctx.font = '16px Arial';
        ctx.fillText('Press Restart to play again', board.width / 2, board.height / 2 + 20);
      }
    }

    function step() {
      if (gameOver) return;

      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
      const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);
      if (hitWall || hitSelf) {
        gameOver = true;
        draw();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function setDirection(x, y) {
      if (x === -direction.x && y === -direction.y) return;
      nextDirection = { x, y };
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
        event.preventDefault();
      }

      if (key === 'arrowup' || key === 'w') setDirection(0, -1);
      if (key === 'arrowdown' || key === 's') setDirection(0, 1);
      if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
      if (key === 'arrowright' || key === 'd') setDirection(1, 0);
    });

    restartBtn.addEventListener('click', resetGame);

    resetGame();
    tickInterval = setInterval(step, 110);
  </script>
</body>
</html>
